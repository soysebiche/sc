name: apply-f9-historico
on:
  push:
    branches: [celeste/clausura-f9-moquegua-result]
    paths: [patches/clausura-f9-moquegua.json, .github/workflows/apply-f9-historico.yml]
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: celeste/clausura-f9-moquegua-result
          fetch-depth: 0
      - name: Restore historico from main and append F9 row
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/data/historico_completo_sc.json > /tmp/historico_main.json
          python3 <<'PY'
          import json
          from pathlib import Path
          main = Path('/tmp/historico_main.json').read_text()
          rows = json.loads(main)
          patch = json.loads(Path('patches/clausura-f9-moquegua.json').read_text())
          if rows and rows[-1].get('Fecha') == patch['Fecha'] and rows[-1].get('Equipo Local') == patch['Equipo Local'] and rows[-1].get('Marcador') == patch['Marcador']:
              print('already applied', len(rows))
              Path('/tmp/already').write_text('1')
          else:
              body = main.rstrip()
              assert body.endswith(']'), repr(body[-40:])
              body = body[:-1].rstrip()
              inner = []
              for k, v in patch.items():
                  inner.append(f'    {json.dumps(k, ensure_ascii=False)}: {json.dumps(v, ensure_ascii=False)}')
              row_block = '  {\n' + ',\n'.join(inner) + '\n  }'
              new = body + ',\n' + row_block + '\n]\n'
              parsed = json.loads(new)
              assert len(parsed) == len(rows) + 1
              assert parsed[-1]['Marcador'] == '1-2'
              assert parsed[-1]['Equipo Local'] == 'Dep. Moquegua'
              Path('src/data/historico_completo_sc.json').write_text(new)
              print('wrote', len(parsed), 'records')
              Path('/tmp/already').write_text('0')
          PY
          if [ "$(cat /tmp/already)" = "1" ]; then
            echo 'No historico change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/historico_completo_sc.json
          git commit -m 'Add Clausura F9: Dep. Moquegua 1-2 Sporting Cristal'
          git push origin HEAD:celeste/clausura-f9-moquegua-result
